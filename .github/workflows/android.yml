name: Android CI and release

on:
  push:
    branches: [main]
    # The planner checks each commit, including changes reverted in one push.
    # Commits outside the configured folders do not get a tag or an APK build.
  pull_request:
    branches: [main]
    paths: ['android/**', 'tools/**']

jobs:
  verify-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main

      - name: Verify release planning and app copy
        run: python3 -m unittest discover -s tools/tests

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/android -o "$HOME/.local/bin/android"
          chmod +x "$HOME/.local/bin/android"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: android --no-metrics --sdk="$ANDROID_HOME" sdk install platform-tools platforms/android-36 build-tools/36.0.0

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Test and build debug APK
        working-directory: android
        run: ./gradlew -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --no-parallel --max-workers=2 --warning-mode all

  plan-releases:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_releases: ${{ steps.plan.outputs.has_releases }}
    steps:
      - name: Check out full commit and tag history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release planning and app copy
        run: python3 -m unittest discover -s tools/tests

      - name: Read completed APK releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.draft == false) | {tag_name, assets: [.assets[].name]}' > "$RUNNER_TEMP/numi-releases.jsonl"

      - name: Plan one release per matching commit
        id: plan
        run: python3 tools/release.py --published-releases "$RUNNER_TEMP/numi-releases.jsonl" --github-output "$GITHUB_OUTPUT"

  release:
    needs: plan-releases
    if: needs.plan-releases.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan-releases.outputs.matrix) }}
    concurrency:
      group: numi-release-${{ matrix.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/android -o "$HOME/.local/bin/android"
          chmod +x "$HOME/.local/bin/android"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: android --no-metrics --sdk="$ANDROID_HOME" sdk install platform-tools platforms/android-36 build-tools/36.0.0

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          NUMI_VERSION_CODE: ${{ matrix.version_code }}
          NUMI_VERSION_NAME: ${{ matrix.version_name }}
        run: ./gradlew -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --no-parallel --max-workers=2 --warning-mode all

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Verify immutable tag target
        env:
          NUMI_RELEASE_TAG: ${{ matrix.tag }}
          NUMI_RELEASE_SHA: ${{ matrix.sha }}
        run: |
          git fetch origin --tags
          python3 tools/release.py --verify-tag "$NUMI_RELEASE_TAG" --commit "$NUMI_RELEASE_SHA"

      - name: Publish production release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.tag }}
          name: Numi ${{ matrix.version_name }}
          target_commitish: ${{ matrix.sha }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      - name: Remove temporary signing key
        if: always()
        run: rm -f android/app/release.keystore
